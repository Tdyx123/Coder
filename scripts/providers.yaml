providers:
  - name: minimax
    base_url: https://api.minimaxi.com/v1
    api_keys:
      - your_minimax_api_key_here
    models:
      - MiniMax-M2.7

  - name: deepseek
    base_url: https://api.deepseek.com/v1
    api_keys:
      - your_deepseek_api_key_here
    models:
      - deepseek-chat
      - deepseek-reasoner
      - deepseek-v4-pro

  - name: poloapi
    base_url: https://poloapi.top/v1
    api_keys:
      - your_poloapi_api_key_here
    models:
      - gpt-4o
